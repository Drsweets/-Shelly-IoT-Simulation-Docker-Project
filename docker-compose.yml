version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: shelly-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    environment:
      - TZ=${TZ}
    networks:
      - shelly-net

  sensor-simulator:
    build: ./simulator
    container_name: shelly-simulator
    restart: unless-stopped
    depends_on:
      - mosquitto
    env_file:
      - .env
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_TOPIC=shelly/sim/device_01
    networks:
      - shelly-net

  mqtt-consumer:
    build: ./mqtt-consumer
    container_name: shelly-mqtt-consumer
    restart: unless-stopped
    depends_on:
      - mosquitto
      - postgres
    env_file:
      - .env
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_TOPIC=shelly/sim/device_01
    networks:
      - shelly-net

  postgres:
    image: postgres:16-alpine
    container_name: shelly-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - TZ=${TZ}
    networks:
      - shelly-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: shelly-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    env_file:
      - .env
    environment:
      - TZ=${TZ}
    depends_on:
      - postgres
    networks:
      - shelly-net

networks:
  shelly-net:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:
